<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Manutenção Industrial - WebAR</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <header id="hud">

        <div class="hud-text">

            <strong>TORNO CNC • MANUTENÇÃO INDUSTRIAL</strong>

            <span id="status">
                Inicializando a câmera...
            </span>

        </div>

        <span id="badge">
            INICIANDO
        </span>

    </header>


    <a-scene
        id="ar-scene"

        mindar-image="
            imageTargetSrc: assets/targets/torno.mind;
            autoStart: true;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            alpha: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        embedded>


        <a-camera
            id="ar-camera"
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <a-entity
            id="target"
            mindar-image-target="targetIndex: 0">

        </a-entity>


    </a-scene>


    <script src="js/app.js"></script>

</body>

</html>
