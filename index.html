<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manutenção Industrial - WebAR</title>

    <link rel="stylesheet" href="frontend/css/style.css">

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <div class="card">

        <h1 id="nome">Carregando...</h1>

        <p>
            <strong>Status:</strong>
            <span id="status">Carregando...</span>
        </p>

        <p>
            <strong>Temperatura:</strong>
            <span id="temperatura">--</span>
        </p>

        <p>
            <strong>Vibração:</strong>
            <span id="vibracao">--</span>
        </p>

        <p>
            <strong>Última manutenção:</strong>
            <span id="manutencao">--</span>
        </p>

    </div>

    <a-scene
	mindar-image="imageTargetSrc: frontend/assets/targets/torno.mind;"
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <a-image
                src="frontend/assets/images/torno.png"
                position="0 0 0"
                width="1"
                height="0.7">
            </a-image>

        </a-entity>

    </a-scene>

    <script src="frontend/js/app.js"></script>

</body>

</html>
