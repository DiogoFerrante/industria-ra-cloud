services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-industria
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - industria

  backend:
    build: ./backend
    container_name: backend-industria
    ports:
      - "5000:5000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      EQUIPAMENTO_ID: CNC-01
    depends_on:
      - mosquitto
    networks:
      - industria

  simulator:
    build: ./simulator
    container_name: simulador-industria
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      EQUIPAMENTO_ID: CNC-01
      INTERVALO_SEGUNDOS: "10"
    depends_on:
      - mosquitto
    networks:
      - industria

  frontend:
    image: nginx:alpine
    container_name: frontend-industria
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - industria

networks:
  industria:
    driver: bridge
